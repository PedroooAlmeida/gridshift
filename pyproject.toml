[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gridshift"
version = "0.3.0"
description = "Factory scheduling with verifiable energy economics"
requires-python = ">=3.9"
dependencies = [
  "ortools==9.15.6755",
  "pydantic==2.13.5",
  "streamlit==1.50.0",
  "plotly==6.9.0",
  "openai==2.48.0",
  "anthropic==0.125.0",
]


[project.optional-dependencies]
dev = ["ruff==0.14.0"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["gridshift*"]

[tool.setuptools.package-data]
"gridshift.data" = ["*.json"]
