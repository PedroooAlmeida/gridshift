[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gridshift"
version = "0.2.0"
description = "Factory scheduling with verifiable energy economics"
requires-python = ">=3.9"
dependencies = [
  "ortools==9.15.6755",
  "pydantic==2.13.5",
  "streamlit==1.50.0",
  "plotly==6.9.0",
  "openai==2.48.0",
]


[tool.setuptools.packages.find]
include = ["gridshift*"]
